<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #08080f; }
      .moon { fill: #c8a850; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f5f5f0; }
      .moon { fill: #a08030; }
    }
  </style>
  <!-- Background circle -->
  <circle class="bg" cx="16" cy="16" r="16"/>
  <!-- Crescent moon shape -->
  <circle class="moon" cx="16" cy="16" r="9"/>
  <circle class="bg" cx="19" cy="13" r="7"/>
</svg>
