<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0815; }
      .bar { fill: #d946ef; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f5f0ff; }
      .bar { fill: #7e22ce; }
    }
  </style>
  <!-- Rounded square background -->
  <rect class="bg" width="32" height="32" rx="7"/>
  <!-- Audio equalizer bars, bottom-aligned at y=28 -->
  <rect class="bar" x="3"  y="14" width="5" height="14" rx="2.5"/>
  <rect class="bar" x="10" y="6"  width="5" height="22" rx="2.5"/>
  <rect class="bar" x="17" y="10" width="5" height="18" rx="2.5"/>
  <rect class="bar" x="24" y="18" width="5" height="10" rx="2.5"/>
</svg>
